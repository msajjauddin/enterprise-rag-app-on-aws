[tox]
envlist = lambdas, api
skipsdist = True

# Lambda functions (boto3, psycopg2, LangChain are mocked in src/tests/unit/conftest.py)
[testenv:lambdas]
deps =
    pytest>=8.3.5
    pytest-cov>=6.1.1
commands =
    pytest src/tests/unit --cov=src --cov-report=xml:coverage.xml --cov-config=tox.ini --cov-branch

# FastAPI query service
[testenv:api]
changedir = services/query_api
deps =
    -r services/query_api/requirements-dev.txt
commands =
    pytest tests --cov=app --cov-report=xml:coverage.xml --cov-branch

[coverage:run]
source = src
omit = src/tests/*, */__init__.py, src/utils/*
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
