name: Terraform AWS Deployment

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TERRAFORM_VERSION: 1.9.8
  PYTHON_VERSION: '3.12'

# GitHub OIDC -> per-environment deploy role (see bootstrap/). No long-lived AWS keys.
permissions:
  id-token: write
  contents: read

jobs:
  determine_environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      project_name: ${{ steps.read-vars.outputs.project_name }}
      aws_region: ${{ steps.read-vars.outputs.aws_region }}
      deploy: ${{ steps.set-env.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            # Pull requests plan against the environment of their target branch
            BRANCH="${{ github.base_ref || github.ref_name }}"
            case "$BRANCH" in
              main) ENV="prod" ;;
              staging) ENV="staging" ;;
              *) ENV="dev" ;;
            esac
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "deploy=false" >> $GITHUB_OUTPUT
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - id: read-vars
        run: |
          ENV="${{ steps.set-env.outputs.environment }}"
          PROJECT_NAME=$(grep -E '^project_name' environments/$ENV/terraform.tfvars | cut -d '=' -f2 | tr -d ' "')
          AWS_REGION=$(grep -E '^aws_region' environments/$ENV/terraform.tfvars | cut -d '=' -f2 | tr -d ' "')
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT

  # Blocking quality gate: unit tests, Terraform formatting/validation, SonarQube quality gate
  code-quality:
    name: Tests and SonarQube
    runs-on: ubuntu-latest
    needs: [determine_environment]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run unit tests (Lambdas and query service)
        run: |
          pip install tox
          tox

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt and validate
        run: |
          terraform fmt -check -recursive
          for ENV in dev staging prod; do
            (cd environments/$ENV && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Build Lambda functions
  build_lambda:
    needs: [determine_environment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Package Lambda functions
        run: |
          mkdir -p lambda_artifacts
          LAMBDA_DIRS=("document_processor" "db_init" "token_enricher")

          for DIR in "${LAMBDA_DIRS[@]}"; do
            echo "Packaging $DIR Lambda"

            # 1. Create a clean staging directory
            STAGING="lambda_artifacts/staging_$DIR"
            mkdir -p "$STAGING"
            cp -r src/$DIR/* "$STAGING/"

            # 2. Install deps INTO the staging dir for the Lambda runtime (python3.12, x86_64)
            if grep -qvE '^\s*(#|$)' "src/$DIR/requirements.txt"; then
              pip install \
                --no-cache-dir \
                --platform manylinux2014_x86_64 \
                --target="$STAGING" \
                --implementation cp \
                --python-version 3.12 \
                --only-binary=:all: \
                -r "src/$DIR/requirements.txt"
            fi

            # 3. STRIP boto3/botocore (provided by Lambda runtime)
            rm -rf "$STAGING"/boto3* \
                   "$STAGING"/botocore* \
                   "$STAGING"/s3transfer* \
                   "$STAGING"/jmespath*

            # 4. STRIP bloat
            find "$STAGING" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find "$STAGING" -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
            find "$STAGING" -type f -name "*.pyc" -delete 2>/dev/null || true

            # 5. Zip from INSIDE the staging dir (clean root structure)
            (cd "$STAGING" && zip -qr "../$DIR.zip" .)
            echo ">>> $DIR.zip size: $(du -sh lambda_artifacts/$DIR.zip | cut -f1)"
            rm -rf "$STAGING"
          done

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-artifacts
          path: lambda_artifacts/*.zip
          retention-days: 1

  # Build the query service image; push to the shared ECR repository (immutable tags = git SHA)
  build_image:
    needs: [determine_environment, code-quality]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine_environment.outputs.environment }}
    env:
      PROJECT_NAME: ${{ needs.determine_environment.outputs.project_name }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        if: needs.determine_environment.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.determine_environment.outputs.aws_region }}

      - name: Login to ECR
        if: needs.determine_environment.outputs.deploy == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          if [[ "${{ needs.determine_environment.outputs.deploy }}" != "true" ]]; then
            docker build -t query-api:$IMAGE_TAG services/query_api
            exit 0
          fi
          REPO="${{ steps.ecr.outputs.registry }}/${PROJECT_NAME}-query-api"
          # Tags are immutable; a re-run of the same commit reuses the pushed image
          if aws ecr describe-images --repository-name "${PROJECT_NAME}-query-api" --image-ids imageTag=$IMAGE_TAG >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already in ECR"
            exit 0
          fi
          docker build -t "$REPO:$IMAGE_TAG" services/query_api
          docker push "$REPO:$IMAGE_TAG"

  terraform-plan:
    needs: [determine_environment, build_lambda, build_image]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine_environment.outputs.environment }}
    env:
      PROJECT_NAME: ${{ needs.determine_environment.outputs.project_name }}
      STAGE: ${{ needs.determine_environment.outputs.environment }}
      AWS_REGION: ${{ needs.determine_environment.outputs.aws_region }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.determine_environment.outputs.aws_region }}

      - name: Create Backend Configuration
        run: |
          cat > environments/$STAGE/backend.tf << EOF
          terraform {
            backend "s3" {
              bucket         = "${PROJECT_NAME}-terraform-state"
              key            = "${STAGE}/terraform.tfstate"
              region         = "${AWS_REGION}"
              dynamodb_table = "${PROJECT_NAME}-${STAGE}-terraform-state-lock"
              encrypt        = true
            }
          }
          EOF

      - name: Create Terraform State Bucket and DynamoDB Table
        run: |
          BUCKET_NAME="${PROJECT_NAME}-terraform-state"
          DYNAMODB_TABLE="${PROJECT_NAME}-${STAGE}-terraform-state-lock"

          aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null || aws s3api create-bucket --bucket $BUCKET_NAME --region $AWS_REGION $(if [[ "$AWS_REGION" != "us-east-1" ]]; then echo "--create-bucket-configuration LocationConstraint=$AWS_REGION"; fi)
          aws s3api put-bucket-versioning --bucket $BUCKET_NAME --versioning-configuration Status=Enabled
          aws dynamodb describe-table --table-name $DYNAMODB_TABLE 2>/dev/null || aws dynamodb create-table --table-name $DYNAMODB_TABLE --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-artifacts
          path: lambda_artifacts/

      - name: Upload Lambda ZIP files to S3
        run: |
          LAMBDA_BUCKET_NAME="${PROJECT_NAME}-${STAGE}-lambda-code"
          aws s3api head-bucket --bucket ${LAMBDA_BUCKET_NAME} 2>/dev/null || \
            aws s3api create-bucket --bucket ${LAMBDA_BUCKET_NAME} \
            --region ${AWS_REGION} $(if [[ "${AWS_REGION}" != "us-east-1" ]]; then echo "--create-bucket-configuration LocationConstraint=${AWS_REGION}"; fi)
          aws s3 cp lambda_artifacts/ s3://${LAMBDA_BUCKET_NAME}/lambda/ --recursive

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: environments/${{ needs.determine_environment.outputs.environment }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: environments/${{ needs.determine_environment.outputs.environment }}
        env:
          TF_VAR_oidc_client_secret: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          terraform plan -input=false \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine_environment.outputs.environment }}
          path: environments/${{ needs.determine_environment.outputs.environment }}/tfplan
          retention-days: 1

  terraform-apply:
    needs: [determine_environment, terraform-plan]
    runs-on: ubuntu-latest
    if: needs.determine_environment.outputs.deploy == 'true'
    environment: ${{ needs.determine_environment.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.determine_environment.outputs.environment }}
      cancel-in-progress: false
    env:
      PROJECT_NAME: ${{ needs.determine_environment.outputs.project_name }}
      STAGE: ${{ needs.determine_environment.outputs.environment }}
      AWS_REGION: ${{ needs.determine_environment.outputs.aws_region }}
    outputs:
      api_endpoint: ${{ steps.terraform-apply.outputs.api_endpoint }}
      document_bucket: ${{ steps.terraform-apply.outputs.document_bucket }}
      dynamodb_table: ${{ steps.terraform-apply.outputs.dynamodb_table }}
      eval_client_secret_arn: ${{ steps.terraform-apply.outputs.eval_client_secret_arn }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.determine_environment.outputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine_environment.outputs.environment }}
          path: environments/${{ needs.determine_environment.outputs.environment }}

      - name: Create Backend Configuration
        run: |
          cat > environments/$STAGE/backend.tf << EOF
          terraform {
            backend "s3" {
              bucket         = "${PROJECT_NAME}-terraform-state"
              key            = "${STAGE}/terraform.tfstate"
              region         = "${AWS_REGION}"
              dynamodb_table = "${PROJECT_NAME}-${STAGE}-terraform-state-lock"
              encrypt        = true
            }
          }
          EOF

      - name: Terraform Init
        working-directory: environments/${{ needs.determine_environment.outputs.environment }}
        run: terraform init -input=false

      - name: Terraform Apply
        id: terraform-apply
        working-directory: environments/${{ needs.determine_environment.outputs.environment }}
        run: |
          terraform apply -input=false -auto-approve tfplan

          API_ENDPOINT=$(terraform output -raw api_endpoint)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_app_client_id)
          COGNITO_DOMAIN=$(terraform output -raw cognito_domain)
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          DOCUMENT_BUCKET=$(terraform output -raw document_bucket)
          DYNAMODB_TABLE=$(terraform output -raw dynamodb_table)

          # Settings for the Streamlit UI (rag_ui/.env)
          cat > ../../env_vars.env << EOF
          API_ENDPOINT=$API_ENDPOINT
          AWS_REGION=$AWS_REGION
          COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID
          COGNITO_DOMAIN=$COGNITO_DOMAIN
          COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID
          EOF

          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
          echo "document_bucket=$DOCUMENT_BUCKET" >> $GITHUB_OUTPUT
          echo "dynamodb_table=$DYNAMODB_TABLE" >> $GITHUB_OUTPUT
          echo "eval_client_secret_arn=$(terraform output -raw eval_client_secret_arn)" >> $GITHUB_OUTPUT
          echo "db_init_function=$(terraform output -raw db_init_function)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "✅ API Endpoint: $API_ENDPOINT"

      - name: Upload UI Env File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-env-vars-${{ needs.determine_environment.outputs.environment }}
          path: env_vars.env

      - name: Run database migrations (db_init)
        run: |
          FUNCTION="${{ steps.terraform-apply.outputs.db_init_function }}"
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          aws lambda invoke --function-name "$FUNCTION" --cli-read-timeout 310 --payload '{}' db_init_output.json > invoke_meta.json
          cat db_init_output.json
          if grep -q FunctionError invoke_meta.json; then
            echo "::error::db_init failed"
            exit 1
          fi

      - name: Wait for ECS blue/green deployment to finish
        run: |
          # Blocks until the new task set is serving and the bake time has passed,
          # or fails if ECS rolled back (5xx alarm or failed health checks)
          aws ecs wait services-stable \
            --cluster "${{ steps.terraform-apply.outputs.ecs_cluster }}" \
            --services "${{ steps.terraform-apply.outputs.ecs_service }}"
          ROLLOUT=$(aws ecs describe-services \
            --cluster "${{ steps.terraform-apply.outputs.ecs_cluster }}" \
            --services "${{ steps.terraform-apply.outputs.ecs_service }}" \
            --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" --output text)
          echo "Rollout state: $ROLLOUT"
          if [[ "$ROLLOUT" != "COMPLETED" ]]; then
            echo "::error::ECS deployment did not complete ($ROLLOUT)"
            exit 1
          fi

  integration_tests:
    needs: [determine_environment, terraform-apply]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine_environment.outputs.environment }}
    env:
      API_ENDPOINT: ${{ needs.terraform-apply.outputs.api_endpoint }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Run integration tests
        run: |
          pip install requests
          python src/tests/integration/run_integration_tests.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-test-results.xml

  # Evaluation gate: golden-set retrieval and answer quality must meet thresholds
  golden_set_eval:
    needs: [determine_environment, terraform-apply, integration_tests]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine_environment.outputs.environment }}
    env:
      API_ENDPOINT: ${{ needs.terraform-apply.outputs.api_endpoint }}
      AWS_REGION: ${{ needs.determine_environment.outputs.aws_region }}
      DOCUMENT_BUCKET: ${{ needs.terraform-apply.outputs.document_bucket }}
      METADATA_TABLE: ${{ needs.terraform-apply.outputs.dynamodb_table }}
      EVAL_CLIENT_SECRET_ARN: ${{ needs.terraform-apply.outputs.eval_client_secret_arn }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.determine_environment.outputs.aws_region }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Run golden-set evaluation
        run: |
          pip install -r evals/requirements.txt
          python evals/run_eval.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ needs.determine_environment.outputs.environment }}
          path: eval-report.json
