sonar.projectKey=msajjauddin_rag-app-on-aws
sonar.organization=msajjauddin

# Path to sources
sonar.sources=src,services/query_api/app,evals
sonar.exclusions=**/*.pyc,**/__pycache__/**,src/tests/**,src/utils/**

# Path to tests
sonar.tests=src/tests,services/query_api/tests
sonar.test.inclusions=src/tests/unit/*.py,services/query_api/tests/*.py

# Python version
sonar.python.version=3.12

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml,services/query_api/coverage.xml

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Fail the CI job when the quality gate fails (the deploy depends on this job)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
